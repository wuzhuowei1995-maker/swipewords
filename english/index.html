<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="description" content="极简随机英语词汇、搭配、句子和段落复习">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>English · Random Review</title>
<style>
:root { color-scheme:light; --bg:#f7f7f4; --ink:#151515; --soft:#62635f; }
* {box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body {width:100%;height:100%;margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC",sans-serif}
body {overflow:hidden; overscroll-behavior:none;}
#app {height:100dvh; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;}
#view {width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;
padding: max(48px, env(safe-area-inset-top)) 30px max(48px, env(safe-area-inset-bottom));}
.content {width:min(100%,620px);max-height:100%;text-align:center;overflow-wrap:anywhere;overflow-y:auto;
scrollbar-width:none; -webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar {display:none}
.term {font-size:clamp(36px,9.2vw,60px);line-height:1.15;letter-spacing:-.025em;font-weight:700;white-space:pre-wrap}
.meaning {font-size:clamp(19px,5vw,26px);font-weight:500;line-height:1.48;margin-top:28px;white-space:pre-wrap}
.example {font-size:clamp(17px,4.5vw,22px);color:var(--soft);line-height:1.55;margin-top:25px;white-space:pre-wrap}
.sentence {font-size:clamp(27px,6.6vw,43px);line-height:1.38;letter-spacing:-.012em;font-weight:600;white-space:pre-wrap}
.paragraph {font-size:clamp(17px,4.25vw,21px);line-height:1.66;letter-spacing:-.008em;font-weight:450;text-align:left;white-space:pre-wrap}
#view.short {touch-action:none;user-select:none;-webkit-user-select:none}
#view.long {touch-action:pan-y}
#view.long .content {user-select:text;-webkit-user-select:text}
@media (prefers-reduced-motion:no-preference){.content.fade-in{animation:in .15s ease-out}@keyframes in{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}
@media (max-height:620px){.term{font-size:clamp(29px,8vw,48px)}.meaning{margin-top:19px}.example{margin-top:14px}.paragraph{font-size:16px}}

/* Small opt-in management control; never obscures the vocabulary text. */
#review-menu-btn{position:fixed;right:15px;bottom:calc(env(safe-area-inset-bottom) + 12px);
  z-index:10;border:1px solid #e1e2dc;border-radius:50%;width:44px;height:44px;
  background:rgba(247,247,244,.96);color:#787974;font-size:27px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
#review-menu-btn:focus-visible,.sheet button:focus-visible,.sheet summary:focus-visible{outline:2px solid #426451;outline-offset:3px}
#review-modal[hidden]{display:none}
#review-modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.review-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.32)}
.review-sheet{position:relative;background:var(--bg);width:min(100%,620px);
  border-radius:21px 21px 0 0;max-height:88dvh;overflow:auto;padding:23px 24px calc(env(safe-area-inset-bottom) + 28px);
  box-shadow:0 -12px 42px rgba(0,0,0,.1);overscroll-behavior:contain}
.review-head{display:flex;align-items:center;justify-content:space-between;gap:15px}
.review-head h2{font-size:21px;letter-spacing:-.02em;margin:0;font-weight:680}
.review-close{border:0;background:transparent;font-size:26px;color:#696a65;min-width:40px;min-height:40px;cursor:pointer}
.review-current{font-size:15px;color:var(--soft);line-height:1.4;margin:14px 0 8px;overflow-wrap:anywhere}
.review-progress{font-size:12px;color:#7c7e77;margin:0 0 15px}
.review-hide{width:100%;font-size:16px;font-weight:620;background:#343b37;color:#fff;border:0;
  padding:16px;border-radius:12px;cursor:pointer}
.review-hide:disabled{background:#dcded8;color:#767873;cursor:default}
.review-manage{margin-top:18px;border-top:1px solid #dedfd9;padding-top:17px}
.review-manage summary{cursor:pointer;font-size:15px;font-weight:600;list-style:revert}
.review-batch-actions{padding:12px 0 3px}
.review-batch{width:100%;border-radius:11px;border:1px solid #c1c8c0;background:#e6eee5;color:#293c2d;font-size:14px;font-weight:650;min-height:46px;padding:10px;cursor:pointer}
.review-batch:disabled{opacity:.44;cursor:default}
.review-batch-note{font-size:12px;color:#777873;line-height:1.5;margin:8px 0}
.review-removed-list{max-height:37dvh;overflow-y:auto;margin-top:13px;border-top:1px solid #e1e2de}
.review-removed-row{display:flex;gap:14px;align-items:center;justify-content:space-between;
  border-bottom:1px solid #e1e2de;padding:10px 0}
.review-removed-name{font-size:14px;line-height:1.4;overflow-wrap:anywhere;min-width:0}
.review-removed-name small{display:block;color:var(--soft);font-size:12px;margin-top:4px}
.review-row-actions{display:flex;gap:5px;flex-direction:column;align-items:stretch;flex-shrink:0}
.review-github{font-size:12px;background:#eef2ed;border-color:#cad4c8}
.review-restore{border:1px solid #c6c9c2;border-radius:9px;background:transparent;
  color:#323831;padding:9px 11px;white-space:nowrap;cursor:pointer;font-size:14px;flex-shrink:0}
.review-empty{font-size:14px;color:var(--soft);margin:14px 0}
.review-footnote{font-size:12px;color:#777873;line-height:1.6;margin:20px 0 0}
@media(min-width:620px){.review-sheet{border-radius:21px;margin-bottom:max(12px,env(safe-area-inset-bottom))}}

</style>
</head>
<body>
<main id="app" aria-label="Random English review"><article id="view" class="short"><div id="content" class="content" aria-live="polite"></div></article></main>

<button id="review-menu-btn" type="button" aria-label="词条管理" aria-haspopup="dialog" aria-controls="review-sheet">⋯</button>
<div id="review-modal" hidden>
  <div id="review-backdrop" class="review-backdrop"></div>
  <section id="review-sheet" class="review-sheet" role="dialog" aria-modal="true" aria-labelledby="review-title">
    <div class="review-head"><h2 id="review-title">词条管理</h2>
      <button id="review-close" class="review-close" type="button" aria-label="关闭">×</button></div>
    <p id="review-current" class="review-current"></p>
    <p id="review-progress" class="review-progress"></p>
    <button id="review-hide" class="review-hide" type="button">将当前词条移出复习</button>
    <details id="review-manage" class="review-manage">
      <summary id="review-manage-title">已移除（0）</summary>
      <div class="review-batch-actions">
        <button id="review-batch" class="review-batch" type="button">批量提交全部已移除词条（12小时后删除）</button>
        <p class="review-batch-note">将所有已移除的单词和句子合并成一份 GitHub 申请；还需在 GitHub 点击 Submit new issue。</p>
      </div>
      <div id="review-removed-list" class="review-removed-list"></div>
    </details>
    <p class="review-footnote">本机移除立即生效，无须登录。永久删除需要你在 GitHub 提交一次申请，才会进入12小时定时删除流程；本机不会自动上传记录。12小时内关闭相应 Issue 即可取消；仅在本机恢复不会撤销已提交的申请。<a href="https://github.com/wuzhuowei1995-maker/swipewords/issues" target="_blank" rel="noopener noreferrer">查看／取消 GitHub 申请</a></p>
  </section>
</div>

<script src="./vocabulary.js"></script>
<script src="./app.js"></script>
</body>
</html>
