name: Sync English card removals after 12 hours

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: english-card-deletion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Apply owner-approved requests older than 12 hours
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const threshold = 12 * 60 * 60 * 1000;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const due = [];
            for (const issue of issues) {
              if (issue.pull_request || issue.user?.login !== owner ||
                  !issue.title?.startsWith('[English card deletion] ')) continue;
              // Reopening a cancelled Issue restarts the 12-hour grace period.
              let openSince = Date.parse(issue.created_at);
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: issue.number, per_page: 100
              });
              for (const event of events) {
                if (event.event === 'reopened') {
                  openSince = Math.max(openSince, Date.parse(event.created_at));
                }
              }
              if (Date.now() - openSince < threshold) continue;
              const body = issue.body || '';
              const header = body.split(/\r?\n/, 1)[0].trim();
              if (!['ENGLISH_DELETE_REQUEST_V1', 'ENGLISH_DELETE_REQUEST_V2'].includes(header)) continue;
              const lines = [...body.matchAll(/^key=(\S+)\s*$/gm)];
              // V1 must contain exactly one key. Batch V2 supports multiple.
              if (header === 'ENGLISH_DELETE_REQUEST_V1' && lines.length !== 1) continue;
              if (!lines.length || lines.length > 1000) continue;
              const parsed = [];
              let invalid = false;
              for (const line of lines) {
                let key;
                try { key = decodeURIComponent(line[1]); }
                catch { invalid = true; break; }
                const parts = key.split('\u241f');
                if (parts.length !== 2 || !['phrase', 'sentence'].includes(parts[0]) ||
                    !parts[1] || parts[1].length > 5000) {
                  invalid = true; break;
                }
                parsed.push({ issue, kind: parts[0], front: parts[1] });
              }
              if (!invalid) due.push(...parsed);
            }
            if (!due.length) {
              core.info('No eligible owner-confirmed deletion requests.');
              return;
            }
            const path = 'english/vocabulary.js';
            const file = await github.rest.repos.getContent({ owner, repo, path });
            if (Array.isArray(file.data)) throw Error('Expected vocabulary file.');
            const original = Buffer.from(file.data.content, 'base64').toString('utf8');
            const match = original.match(/^window\.ENGLISH_CARDS\s*=\s*(\[[\s\S]*\]);?\s*$/);
            if (!match) throw Error('Unexpected vocabulary file format.');
            const entries = JSON.parse(match[1]);
            const removeKeys = new Set(due.map(d => d.kind + '\u241f' + d.front));
            const remaining = entries.filter(entry =>
              !(['phrase', 'sentence'].includes(entry.kind) &&
                removeKeys.has(entry.kind + '\u241f' + entry.front)));
            if (remaining.length !== entries.length) {
              const updated = 'window.ENGLISH_CARDS = ' + JSON.stringify(remaining) + ';\n';
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                sha: file.data.sha,
                message: 'Apply English card deletions approved 30+ days ago',
                content: Buffer.from(updated, 'utf8').toString('base64')
              });
              const swPath = 'english/sw.js';
              const sw = await github.rest.repos.getContent({ owner, repo, path: swPath });
              if (Array.isArray(sw.data)) throw Error('Expected service worker file.');
              const swText = Buffer.from(sw.data.content, 'base64').toString('utf8');
              const replacement = 'const CACHE="english-random-review-sync-' + Date.now() + '"';
              const bumped = swText.replace(/const CACHE="[^"]+"/, replacement);
              if (bumped === swText) throw Error('Could not update offline cache name.');
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: swPath,
                sha: sw.data.sha,
                message: 'Invalidate offline cache after synchronized deletions',
                content: Buffer.from(bumped, 'utf8').toString('base64')
              });
              core.info('Removed ' + (entries.length - remaining.length) + ' card(s) from GitHub.');
              // GITHUB_TOKEN content commits do not themselves trigger Pages rebuilds.
              // For branch-published Pages sites explicitly request a fresh build.
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/builds', {owner, repo});
                core.info('Requested GitHub Pages rebuild.');
              } catch (err) {
                core.warning('Pages rebuild could not be requested automatically: ' + err.message);
              }
            }
            // Every batch issue should be closed and commented on only once.
            const handled = new Set();
            for (const { issue } of due) {
              if (handled.has(issue.number)) continue;
              handled.add(issue.number);
              const count = due.filter(d => d.issue.number === issue.number).length;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '12-hour review window completed. Processed ' + count +
                  ' requested card(s); existing matches were deleted or were already absent.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }
