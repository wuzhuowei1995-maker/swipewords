<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f5f5f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SwipeWords" />

  <title>SwipeWords</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-180.png" />

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f2;
      --text: #111111;
      --muted: #555555;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding:
        max(32px, env(safe-area-inset-top))
        30px
        max(40px, env(safe-area-inset-bottom));
      text-align: center;
      background: var(--bg);
      will-change: transform, opacity;
    }

    .front {
      max-width: 92%;
      font-size: clamp(36px, 10vw, 58px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }

    .meaning {
      max-width: 88%;
      margin-top: 26px;
      font-size: clamp(19px, 5vw, 25px);
      line-height: 1.45;
      font-weight: 500;
    }

    .example {
      max-width: 88%;
      margin-top: 22px;
      color: var(--muted);
      font-size: clamp(17px, 4.6vw, 22px);
      line-height: 1.48;
      font-weight: 400;
    }

    .kana-card {
      gap: 0;
    }

    .kana-pair {
      width: min(94vw, 620px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      column-gap: 22px;
    }

    .kana-symbol {
      font-size: clamp(118px, 32vw, 180px);
      line-height: 0.96;
      font-weight: 650;
      letter-spacing: 0;
    }

    .kana-pronunciation {
      margin-top: 42px;
      font-size: clamp(48px, 12vw, 72px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.015em;
    }

    .empty {
      font-size: 20px;
      line-height: 1.5;
      padding: 30px;
    }

    .exit-up {
      transform: translateY(-18%);
      opacity: 0;
      transition: transform 150ms ease, opacity 150ms ease;
    }

    .enter-up {
      transform: translateY(15%);
      opacity: 0;
    }

    .enter-active {
      transform: translateY(0);
      opacity: 1;
      transition: transform 170ms ease, opacity 170ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .exit-up, .enter-active {
        transition: none;
      }
    }

    /* SwipeWords local removal and restoration panel */
    #sw-menu-button {
      position: fixed;
      z-index: 100;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 50px; height: 50px;
      border: 0; border-radius: 50%;
      background: rgba(35,35,35,.08);
      color: #222;
      font-size: 33px; line-height: 35px;
      display: grid; place-items: center;
      cursor: pointer; touch-action: manipulation;
    }
    #sw-overlay {
      position: fixed; inset: 0; z-index: 110;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.3);
    }
    #sw-overlay[hidden] {display: none !important;}
    #sw-sheet {
      width: 100%; max-width: 650px;
      max-height: min(84dvh, 850px);
      overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background: #fff; color: #191919;
      padding: 24px 22px max(26px,env(safe-area-inset-bottom));
      border-radius: 23px 23px 0 0;
      box-shadow: 0 -4px 28px rgba(0,0,0,.09);
      text-align: left; user-select: text; -webkit-user-select: text;
    }
    .sw-heading {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .sw-heading-title {font-size: 22px; font-weight: 700;}
    #sw-sheet button {cursor: pointer; font-family: inherit; touch-action: manipulation;}
    #sw-sheet button:disabled {opacity: .4; cursor: default;}
    .sw-close {border: 0; background: transparent; font-size: 31px; line-height: 1;}
    .sw-primary {
      border: none; background: #222; color: white;
      width: 100%; border-radius: 13px;
      padding: 14px 16px; font-size: 16px; font-weight: 600;
    }
    .sw-submit {margin-top: 20px;}
    .sw-help {color: #666; line-height: 1.5; font-size: 13px; margin: 10px 0 18px;}
    .sw-title {font-weight: 700; font-size: 17px; margin: 22px 0 12px;}
    .sw-removed-list {max-height: 34dvh; overflow-y: auto; touch-action: pan-y;}
    .sw-removed-row {display:flex; gap: 12px; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #eee;}
    .sw-removed-group {flex:1; min-width: 0;}
    .sw-removed-front {font-size: 16px; line-height: 1.45; overflow-wrap: anywhere;}
    .sw-muted {color: #777; font-size: 12px; line-height: 1.4;}
    .sw-small {background: #f4f4f4; border: 1px solid #ddd; border-radius: 10px;
      padding: 8px 12px; font-size: 14px; flex-shrink: 0;}
    .sw-link {color: #333; display: inline-block; font-size: 14px; margin: 6px 0 8px;}
    #sw-toast {pointer-events:none; position:fixed; z-index:130; top:max(28px,env(safe-area-inset-top));
      left: 50%; transform:translateX(-50%); max-width:90vw; text-align:center;
      background:#333; color:white; border-radius:12px; padding:12px 18px;
      font-size:13px; line-height:1.35; opacity:0; transition:opacity .15s;}
    #sw-toast.visible {opacity:1;}
  </style>
</head>

<body>
  <main id="app" aria-live="polite"></main>

  <script src="./vocabulary.js"></script>
  <script src="./review.js"></script>
</body>
</html>
